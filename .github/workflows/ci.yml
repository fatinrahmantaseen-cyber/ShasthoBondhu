name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (FastAPI & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shasthobondhu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:ci_test_password@localhost:5432/shasthobondhu_test
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: shasthobondhu_test
      DONOR_PHONE_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD_HASH: "pbkdf2_sha256$600000$63695f746573745f73616c745f686578$b24d7768565c92d5be326e0b7a8fc7f3eecdd9df67d3d7589d424bfa767feff9"
      ADMIN_SECRET_KEY: "ci-test-signing-secret-key-32-bytes-long-for-testing-only"
      ADMIN_TOKEN_EXPIRE_MINUTES: "120"
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:3001", "http://127.0.0.1:3001"]'
      ALLOWED_HOSTS: '["localhost", "127.0.0.1", "testserver"]'
      PYTHONPATH: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run backend test suite
        run: |
          python -m unittest discover -s backend/tests -v

  frontend-checks:
    name: Frontend Quality & Build (Next.js & React)
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js production bundle
        run: npm run build

